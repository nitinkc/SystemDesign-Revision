<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design Core Concepts — Quiz</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; color: #1a1a1a; }
.container { width: 100%; max-width: 680px; }
header { margin-bottom: 2rem; }
header h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
header p { font-size: 14px; color: #666; margin-top: 4px; }
.card { background: #fff; border-radius: 12px; border: 0.5px solid #ddd; padding: 1.75rem; }
.progress-bar-bg { height: 4px; background: #e8e6e0; border-radius: 2px; margin-bottom: 1.5rem; }
.progress-bar-fill { height: 4px; background: #534AB7; border-radius: 2px; transition: width 0.4s ease; }
.meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
.meta-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #555; background: #f0ede8; padding: 4px 10px; border-radius: 20px; }
.meta-count { font-size: 13px; color: #888; }
.question { font-size: 16px; font-weight: 500; color: #1a1a1a; line-height: 1.65; margin-bottom: 1.5rem; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; font-size: 14px; color: #1a1a1a; line-height: 1.5; background: #fff; }
.opt:hover { background: #f8f7f3; border-color: #bbb; }
.opt.selected { border-color: #534AB7; background: #EEEDFE; color: #26215C; }
.opt.correct { border-color: #0F6E56; background: #E1F5EE; color: #04342C; }
.opt.wrong { border-color: #993C1D; background: #FAECE7; color: #4A1B0C; }
.opt .letter { font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; border-radius: 50%; background: #f0ede8; display: flex; align-items: center; justify-content: center; color: #777; flex-shrink: 0; margin-top: 1px; }
.opt.selected .letter { background: #CECBF6; color: #26215C; }
.opt.correct .letter { background: #9FE1CB; color: #04342C; }
.opt.wrong .letter { background: #F5C4B3; color: #4A1B0C; }
.explanation { padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.65; margin-bottom: 1.25rem; display: none; }
.explanation.show { display: block; }
.explanation.correct-exp { background: #E1F5EE; color: #085041; border-left: 3px solid #1D9E75; }
.explanation.wrong-exp { background: #FAECE7; color: #4A1B0C; border-left: 3px solid #D85A30; }
.actions { display: flex; gap: 10px; }
.btn { padding: 9px 20px; font-size: 14px; border-radius: 8px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #1a1a1a; transition: background 0.15s; font-weight: 500; }
.btn:hover { background: #f0ede8; }
.btn-primary { background: #534AB7; color: #fff; border-color: #534AB7; }
.btn-primary:hover { background: #3C3489; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.result-screen { display: none; text-align: center; }
.result-score { font-size: 52px; font-weight: 600; color: #1a1a1a; margin-bottom: 0.4rem; }
.result-pct { font-size: 18px; color: #534AB7; font-weight: 500; margin-bottom: 0.5rem; }
.result-label { font-size: 15px; color: #666; margin-bottom: 2rem; }
.section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #aaa; margin-bottom: 0.75rem; text-align: left; }
.result-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 2rem; text-align: left; }
.rb-card { background: #f8f7f3; border-radius: 8px; padding: 12px 14px; border: 0.5px solid #e0ddd8; }
.rb-card .rb-num { font-size: 22px; font-weight: 600; color: #1a1a1a; }
.rb-card .rb-lbl { font-size: 12px; color: #777; margin-top: 3px; }
.rb-card .rb-detail { font-size: 11px; color: #aaa; margin-top: 2px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>System Design Core Concepts — Quiz</h1>
    <p>40 questions across Networking, Caching, Sharding, CAP Theorem, and more. Shuffled each attempt.</p>
  </header>

  <div class="card" id="quiz">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog" style="width:0%"></div></div>
    <div class="meta">
      <span class="meta-cat" id="cat-label"></span>
      <span class="meta-count" id="q-count"></span>
    </div>
    <div class="question" id="q-text"></div>
    <div class="options" id="opts"></div>
    <div class="explanation" id="exp"></div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-check" disabled onclick="checkAnswer()">Check answer</button>
      <button class="btn" id="btn-next" style="display:none" onclick="nextQ()">Next →</button>
    </div>
  </div>

  <div class="card result-screen" id="result">
    <div class="result-score" id="r-score"></div>
    <div class="result-pct" id="r-pct"></div>
    <div class="result-label" id="r-label"></div>
    <div class="section-title">Score by category</div>
    <div class="result-breakdown" id="r-breakdown"></div>
    <button class="btn btn-primary" onclick="restart()">Restart quiz</button>
  </div>
</div>

<script>
const qs = [
  {cat:"Networking", q:"For most system design interviews, what is the default communication protocol you should use?", opts:["gRPC over HTTP/2","WebSockets","HTTP over TCP","Server-Sent Events"], ans:2, exp:"HTTP over TCP is the well-understood default that works everywhere and handles 90% of use cases. Only deviate with a specific reason."},
  {cat:"Networking", q:"What is the key difference between Server-Sent Events (SSE) and WebSockets?", opts:["SSE is faster than WebSockets","SSE is unidirectional (server pushes to client); WebSockets are bidirectional","WebSockets only work within a data center","SSE requires a special load balancer"], ans:1, exp:"SSE opens an HTTP connection and the server pushes data down it — the client can't send back over the same connection. WebSockets support true two-way messaging."},
  {cat:"Networking", q:"When is it appropriate to use WebSockets instead of SSE?", opts:["Any time real-time updates are mentioned","When you need live scores or notifications","When clients need to push data back to the server frequently","When performance is more critical than simplicity"], ans:2, exp:"WebSockets are necessary only when clients genuinely need to send data back to the server frequently (e.g. chat, live collaboration). SSE is simpler and sufficient for one-way pushes."},
  {cat:"Networking", q:"Why can't WebSocket connections be placed behind a standard load balancer without special consideration?", opts:["WebSockets use a different port than HTTP","They are stateful persistent connections that must be maintained by the same server","WebSockets don't support TLS","Standard load balancers can't handle binary data"], ans:1, exp:"WebSockets (and SSE) are stateful connections. A standard L7 load balancer would break the persistent connection. You need L4 balancing or sticky sessions."},
  {cat:"Networking", q:"What type of load balancer is typically required when dealing with WebSocket connections?", opts:["Layer 7, because it inspects HTTP content","Layer 4, because it maintains a persistent TCP connection","DNS-based load balancing","Anycast load balancing"], ans:1, exp:"WebSockets require Layer 4 (TCP-level) load balancing because you're maintaining a persistent TCP connection, not individual HTTP requests."},
  {cat:"Networking", q:"Why is gRPC not used for public-facing APIs?", opts:["gRPC is too slow for public traffic","Browsers don't natively support gRPC","gRPC doesn't support authentication","gRPC only works within a single data center"], ans:1, exp:"Browsers don't natively support gRPC. gRPC-Web exists as a workaround but requires a proxy and has limitations. The common pattern is REST externally, gRPC internally."},
  {cat:"Networking", q:"What is the minimum latency of a request from New York to London, regardless of processing time?", opts:["Around 5ms","Around 20ms","Around 80ms","Around 200ms"], ans:2, exp:"A transatlantic request has roughly 80ms minimum latency just from the speed of light through fiber optic cables, before any processing occurs."},
  {cat:"API Design", q:"What pagination approach works better for real-time data where new items are frequently added?", opts:["Offset-based pagination","Cursor-based pagination","Page-number pagination","Keyset pagination"], ans:1, exp:"Cursor-based pagination handles real-time data better because it uses a stable pointer into the dataset, unaffected by new items being inserted (which would shift offset-based pages)."},
  {cat:"API Design", q:"What is a common mistake candidates make during the API design phase of a system design interview?", opts:["Using REST instead of GraphQL","Spending too much time designing APIs instead of moving to architectural problems","Not specifying authentication","Forgetting to mention rate limiting"], ans:1, exp:"Spending too long on API design is a common trap. You should sketch 4-5 key endpoints in a couple of minutes and move on to the harder architectural questions."},
  {cat:"API Design", q:"What authentication mechanism is recommended for service-to-service calls?", opts:["JWT tokens","OAuth 2.0","API keys","Session cookies"], ans:2, exp:"JWT tokens are recommended for user sessions; API keys are the go-to for service-to-service calls."},
  {cat:"Data Modeling", q:"What is normalization in the context of relational databases?", opts:["Adding indexes to frequently queried columns","Splitting data across tables to avoid duplication","Copying data into multiple tables for faster reads","Partitioning data across multiple servers"], ans:1, exp:"Normalization splits data across tables to avoid duplication. Each piece of data is stored once and referenced by ID, keeping data consistent but requiring joins to assemble complete records."},
  {cat:"Data Modeling", q:"What is the main downside of denormalization?", opts:["It makes reads slower","It increases storage costs dramatically","Updates become complex — you must update the same data in multiple places","It prevents the use of indexes"], ans:2, exp:"Denormalization duplicates data to avoid joins, making reads faster. But when data changes, you must update every copy — e.g. a username stored in thousands of order records."},
  {cat:"Data Modeling", q:"What is the recommended default approach to data modeling in a system design interview?", opts:["Start with a denormalized model for best read performance","Start normalized and denormalize specific hot paths only if read performance issues arise","Use NoSQL by default to avoid schema constraints","Shard from the beginning to future-proof the design"], ans:1, exp:"Start normalized, then selectively denormalize hot paths when you can justify it. This shows you understand the tradeoffs rather than blindly applying techniques."},
  {cat:"Data Modeling", q:"In DynamoDB, what determines how efficiently a query runs?", opts:["The number of indexes defined","Whether the query uses a join","Whether the access pattern matches the partition key and sort key design","The size of the items being stored"], ans:2, exp:"DynamoDB requires you to design your partition key and sort key around your access patterns upfront. Queries that don't match the key design require expensive full table scans."},
  {cat:"Data Modeling", q:"When does a relational database like Postgres excel over NoSQL?", opts:["When you need to scale horizontally across many servers","When your data structure changes very frequently","When you have structured data with clear relationships and need strong consistency","When you need schema-less flexible documents"], ans:2, exp:"Relational databases shine with structured, relational data requiring strong consistency, complex queries (SQL), transactions, and foreign key constraints."},
  {cat:"Database Indexing", q:"Without an index on an email column in a table with 10 million users, how does the database find a user by email?", opts:["It uses a hash lookup","It scans every single row in the table","It queries a secondary index automatically","It caches the result from a previous query"], ans:1, exp:"Without an index, the database must perform a full table scan — checking every one of the 10 million rows. An index lets it jump directly to the matching row."},
  {cat:"Database Indexing", q:"What type of index supports both exact lookups AND range queries?", opts:["Hash index","Full-text index","B-tree index","Geospatial index"], ans:2, exp:"B-tree indexes keep data sorted in a tree structure, supporting both exact matches and range queries (e.g. all orders between date A and date B). Hash indexes only support exact matches."},
  {cat:"Database Indexing", q:"What is the role of change data capture (CDC) when syncing to an external search index like Elasticsearch?", opts:["It prevents stale data from ever appearing in the search index","It streams changes from the primary database to the search index, causing a small lag","It replaces the primary database with the search index","It validates data consistency between the two systems"], ans:1, exp:"CDC streams changes from the primary DB to Elasticsearch. This means the search index lags slightly behind the primary — but for search use cases, that small staleness is almost always acceptable."},
  {cat:"Database Indexing", q:"When would you use a compound index?", opts:["When you only ever query by a single column","When you have composite queries filtering on multiple columns simultaneously","When you need full-text search capabilities","When your table has more than 1 million rows"], ans:1, exp:"Compound indexes cover queries that filter on multiple columns at once — e.g. finding events in a specific city on a specific date requires an index on both city and date."},
  {cat:"Caching", q:"What is the performance difference between a Redis cache hit and a typical database query?", opts:["Cache is about 2x faster","Cache is about 5x faster","Cache is about 20-50x faster","They are roughly the same speed"], ans:2, exp:"A Redis cache hit takes ~1ms vs 20-50ms for a typical DB query — a 20-50x speedup that matters enormously at millions of requests per second."},
  {cat:"Caching", q:"Describe the cache-aside pattern (the most common caching strategy).", opts:["Write to cache first, then asynchronously write to DB","Check cache first; on miss, query DB, store result in cache with TTL, return result","Always write to both cache and DB simultaneously","Pre-populate the cache with all data at startup"], ans:1, exp:"Cache-aside: check cache → if hit, return it. If miss, query the DB, store result in cache with a TTL, and return it. Simple and effective for read-heavy systems."},
  {cat:"Caching", q:"What is a cache stampede?", opts:["When the cache fills up and starts evicting entries rapidly","When Redis goes down and every request suddenly hits the database, potentially taking down the system","When multiple clients write conflicting data to the cache simultaneously","When cache TTLs are set too short, causing frequent misses"], ans:1, exp:"A cache stampede occurs when the cache fails and the full request load suddenly hits the database, which may not be sized to handle it — potentially causing a full system outage."},
  {cat:"Caching", q:"What data is best suited for caching?", opts:["Data that changes on every request","Data that is written more often than read","Data that is read frequently and doesn't change often","All data to minimize database load"], ans:2, exp:"Cache data that is read frequently and changes rarely. Caching data that changes on every request just adds latency and complexity for zero benefit."},
  {cat:"Caching", q:"What is CDN caching primarily used for, as distinct from Redis caching?", opts:["Storing user session data","Caching database query results near the application server","Serving static assets like images, videos, and JS files from edge locations near users","Caching microservice responses internally"], ans:2, exp:"CDN caching serves static assets (images, videos, JS) from geographically distributed edge servers near users. Redis handles application data. They serve different purposes."},
  {cat:"Sharding", q:"What is the primary reason to introduce sharding into a system?", opts:["To improve read latency on a single server","To support full-text search","To split data across multiple independent servers when a single DB is no longer sufficient","To enable strong consistency across replicas"], ans:2, exp:"Sharding splits data across multiple independent servers when you've hit limits on storage, write throughput, or read throughput that replicas can't address."},
  {cat:"Sharding", q:"What is the most important decision when implementing sharding?", opts:["Whether to use SQL or NoSQL","Choosing the shard key — it determines data distribution and query performance","Choosing between L4 and L7 load balancers","Selecting the replication factor"], ans:1, exp:"The shard key determines how data is distributed and affects everything — which queries are fast (single-shard) and which are slow (cross-shard scatter-gather)."},
  {cat:"Sharding", q:"What is a hot spot in the context of database sharding?", opts:["A shard that stores data at a higher temperature for faster access","When one shard receives disproportionately more traffic than others","A network bottleneck between shards","A shard that has run out of storage space"], ans:1, exp:"A hot spot occurs when one shard gets far more traffic than others — e.g. Taylor Swift's shard getting hammered while others sit idle — defeating the purpose of sharding."},
  {cat:"Sharding", q:"What is the biggest mistake candidates make when proposing sharding?", opts:["Choosing a poor shard key","Proposing sharding too early, before the numbers justify it","Using hash-based instead of range-based sharding","Not considering cross-shard transactions"], ans:1, exp:"Sharding too early is the most common mistake. A well-tuned single database with read replicas handles far more than most candidates think. Do the capacity math first."},
  {cat:"Sharding", q:"Why are cross-shard transactions problematic?", opts:["They require a special network protocol","They become nearly impossible and require distributed transactions or sagas, which are complex and slow","They prevent the use of indexes on sharded data","They require all shards to be on the same physical machine"], ans:1, exp:"When a transaction touches data on multiple shards, you need distributed transactions or saga patterns — both complex and slow. Good shard boundaries avoid cross-shard transactions."},
  {cat:"Consistent Hashing", q:"What problem does consistent hashing solve that simple modulo hashing does not?", opts:["It distributes data more evenly across servers","It allows servers to be added or removed with minimal data movement","It supports range queries across distributed nodes","It prevents hot spots in distributed caches"], ans:1, exp:"With simple modulo hashing, adding/removing one server remaps nearly all keys. Consistent hashing only remaps the fraction of keys belonging to the affected range — roughly 1/N keys."},
  {cat:"Consistent Hashing", q:"How does consistent hashing work at a high level?", opts:["It assigns each server a fixed numeric range of keys","Both servers and keys are hashed onto a virtual ring; each key belongs to the next server clockwise","It maintains a directory of key-to-server mappings updated on each change","It uses a leader server to coordinate which server holds each key"], ans:1, exp:"Consistent hashing places both servers and keys on a virtual ring. A key belongs to the next server clockwise from its position. Adding/removing a server only affects neighboring keys."},
  {cat:"Consistent Hashing", q:"Roughly what percentage of data must move when adding one server to a 10-server cluster using simple modulo hashing?", opts:["About 10%","About 50%","About 90%","About 1%"], ans:2, exp:"With simple modulo hashing, adding one server changes N from 10 to 11, so hash(key) % N changes for ~90% of keys — nearly all data must move. Consistent hashing only moves ~10%."},
  {cat:"Consistent Hashing", q:"In an interview, when is it most relevant to bring up consistent hashing?", opts:["When designing the API layer","When discussing elastic scaling of cache nodes or database shards","When choosing between SQL and NoSQL","When implementing rate limiting"], ans:1, exp:"Consistent hashing is most relevant when discussing elastic scaling — adding/removing cache nodes or DB shards — as the mechanism that avoids massive data movement."},
  {cat:"CAP Theorem", q:"The CAP theorem says you can only have two of three properties. In practice, since network partitions are unavoidable, what is the real choice?", opts:["Between performance and durability","Between consistency and availability","Between latency and throughput","Between sharding and replication"], ans:1, exp:"Since partition tolerance is a requirement in any distributed system (partitions will happen), the real choice is between consistency and availability during a partition."},
  {cat:"CAP Theorem", q:"What does an availability-favoring system do during a network partition?", opts:["Refuses to serve requests until the partition heals","Serves requests from all nodes even if data may be temporarily inconsistent across them","Elects a leader node to serve all requests","Redirects all traffic to a single replica"], ans:1, exp:"An availability-favoring system keeps serving requests on all nodes during a partition. Users always get a response, but different nodes may temporarily have different data."},
  {cat:"CAP Theorem", q:"What is eventual consistency?", opts:["A consistency model where reads always return the most recent write","A model where the system guarantees all nodes will converge to the same state given enough time without new updates","A model that makes no guarantees about data convergence","Strong consistency with a slight delay"], ans:1, exp:"Eventual consistency guarantees that all nodes will eventually converge to the same state if no new updates are made — different from weak consistency, which makes no convergence guarantee."},
  {cat:"CAP Theorem", q:"Which of these systems genuinely requires strong consistency rather than eventual consistency?", opts:["Social media feeds","Video recommendation systems","Inventory counts in an e-commerce system to prevent overselling","Analytics dashboards"], ans:2, exp:"Inventory systems need accurate counts — selling a product you don't have costs real money. Social feeds, recommendations, and analytics can tolerate briefly stale data."},
  {cat:"CAP Theorem", q:"What does the PACELC theorem add to CAP theorem's model?", opts:["It adds a fifth property: partition tolerance in all conditions","During normal (non-partition) operation, there is still a tradeoff between latency and consistency","It shows that availability and consistency are never truly in conflict","It replaces CAP theorem with a more accurate model"], ans:1, exp:"PACELC: during a Partition choose Availability or Consistency; Else (normal ops) choose Latency or Consistency. Strong consistency always adds latency because nodes must coordinate before responding."},
  {cat:"Numbers to Know", q:"Approximately how many operations per second can a single Redis instance handle?", opts:["Around 1,000","Around 10,000","Around 100,000+","Around 1,000,000+"], ans:2, exp:"A single Redis instance handles hundreds of thousands of operations per second. Most candidates underestimate modern hardware and propose caching layers unnecessarily early."},
  {cat:"Numbers to Know", q:"At roughly what storage size does a single Postgres instance become a candidate for sharding?", opts:["500 GB","Tens to hundreds of terabytes","10 TB","100 GB"], ans:1, exp:"A single Postgres instance handles a few terabytes comfortably. You don't need sharding until you're hitting tens or hundreds of terabytes. Proposing sharding at 500GB adds massive unnecessary complexity."},
  {cat:"Numbers to Know", q:"What is the approximate latency for a network call within a single data center?", opts:["Nanoseconds","Microseconds","1–10 milliseconds","100+ milliseconds"], ans:2, exp:"Intra-datacenter network calls take 1-10ms. Memory access is nanoseconds, SSD reads are microseconds, and cross-continent calls are tens to hundreds of milliseconds."},
  {cat:"Numbers to Know", q:"When should you perform back-of-the-envelope capacity calculations in a system design interview?", opts:["Always at the very start of the interview","Never — interviewers don't care about numbers","When you need to make a specific decision, like whether to shard or whether Redis can handle the load","Only when the interviewer explicitly asks for them"], ans:2, exp:"Do the math when it's decision-relevant — 'should I shard? can a single Redis handle this?' — not as a ritual at the start. Interviewers want to see you think through numbers in context."}
];

let cur=0, score=0, chosen=null, catScores={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const shuffled=shuffle([...qs]);

function render(){
  const q=shuffled[cur];
  document.getElementById('cat-label').textContent=q.cat;
  document.getElementById('q-count').textContent=`Question ${cur+1} of ${shuffled.length}`;
  document.getElementById('prog').style.width=(cur/shuffled.length*100)+'%';
  document.getElementById('q-text').textContent=q.q;
  const o=document.getElementById('opts'); o.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const d=document.createElement('div'); d.className='opt';
    d.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${opt}</span>`;
    d.onclick=()=>select(i); o.appendChild(d);
  });
  const exp=document.getElementById('exp'); exp.className='explanation'; exp.style.display='none';
  document.getElementById('btn-check').disabled=true;
  document.getElementById('btn-next').style.display='none';
  chosen=null;
}

function select(i){
  if(document.getElementById('btn-next').style.display!=='none') return;
  chosen=i;
  document.querySelectorAll('.opt').forEach((el,idx)=>{el.className=idx===i?'opt selected':'opt';});
  document.getElementById('btn-check').disabled=false;
}

function checkAnswer(){
  if(chosen===null) return;
  const q=shuffled[cur];
  const ok=chosen===q.ans;
  if(ok) score++;
  document.querySelectorAll('.opt').forEach((el,i)=>{
    if(i===q.ans) el.className='opt correct';
    else if(i===chosen&&!ok) el.className='opt wrong';
    else el.className='opt';
  });
  const exp=document.getElementById('exp');
  exp.textContent=(ok?'✓ Correct — ':'✗ Incorrect — ')+q.exp;
  exp.className='explanation show '+(ok?'correct-exp':'wrong-exp');
  exp.style.display='block';
  document.getElementById('btn-check').disabled=true;
  document.getElementById('btn-next').style.display='inline-block';
  if(!catScores[q.cat]) catScores[q.cat]={c:0,t:0};
  catScores[q.cat].t++;
  if(ok) catScores[q.cat].c++;
}

function nextQ(){
  cur++;
  if(cur>=shuffled.length){showResult();return;}
  render();
}

function showResult(){
  document.getElementById('quiz').style.display='none';
  const res=document.getElementById('result'); res.style.display='block';
  const pct=Math.round(score/shuffled.length*100);
  document.getElementById('r-score').textContent=`${score}/${shuffled.length}`;
  document.getElementById('r-pct').textContent=`${pct}%`;
  const labels=['Keep studying — the concepts will click!','Getting there — review the weaker areas.','Solid grasp of the core concepts!','Excellent system design knowledge!','Near perfect — you are interview-ready!'];
  document.getElementById('r-label').textContent=pct<40?labels[0]:pct<60?labels[1]:pct<75?labels[2]:pct<90?labels[3]:labels[4];
  const bd=document.getElementById('r-breakdown'); bd.innerHTML='';
  Object.entries(catScores).forEach(([cat,s])=>{
    const p=Math.round(s.c/s.t*100);
    const card=document.createElement('div'); card.className='rb-card';
    card.innerHTML=`<div class="rb-num">${p}%</div><div class="rb-lbl">${cat}</div><div class="rb-detail">${s.c}/${s.t} correct</div>`;
    bd.appendChild(card);
  });
}

function restart(){
  cur=0; score=0; chosen=null; catScores={};
  shuffle(shuffled);
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
}

render();
</script>
</body>
</html>
