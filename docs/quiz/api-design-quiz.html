<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Design — Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;min-height:100vh;padding:32px 16px}
.page-header{max-width:680px;margin:0 auto 24px}
.page-title{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.page-sub{font-size:13px;color:#666}
.card{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;border:0.5px solid #ddd;padding:1.75rem}
#prog-lbl{font-size:12px;color:#666;margin-bottom:6px}
#prog-wrap{height:6px;background:#eee;border-radius:3px;margin-bottom:20px;overflow:hidden}
#prog-bar{height:100%;background:#534AB7;border-radius:3px;transition:width .3s ease}
#cat-lbl{font-size:12px;font-weight:500;color:#534AB7;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
#q-text{font-size:16px;font-weight:500;line-height:1.65;margin-bottom:18px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid #ddd;border-radius:8px;cursor:pointer;margin-bottom:8px;background:#fff;transition:background .15s,border-color .15s}
.opt:hover{background:#f8f7f3}
.opt.sel{border-color:#534AB7;background:#EEEDFE;color:#26215C}
.opt.correct{border-color:#0F6E56;background:#E1F5EE;color:#04342C}
.opt.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.opt.dim{border-color:#eee;background:#fafafa;color:#999}
.letter{width:22px;height:22px;min-width:22px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:1px}
.opt-text{font-size:14px;line-height:1.5}
#expl{border-left:3px solid;padding:10px 14px;border-radius:0;font-size:13px;line-height:1.65;margin:12px 0;display:none}
#expl.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041}
#expl.wrong{border-color:#D85A30;background:#FAECE7;color:#4A1B0C}
.btn-row{display:flex;gap:10px;margin-top:16px}
#btn-check{padding:9px 20px;font-size:14px;border-radius:8px;border:none;background:#534AB7;color:#fff;cursor:pointer;opacity:.45;pointer-events:none}
#btn-check.active{opacity:1;pointer-events:auto}
#btn-next{padding:9px 20px;font-size:14px;border-radius:8px;border:1px solid #534AB7;background:transparent;color:#534AB7;cursor:pointer;display:none}
#results-card{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;border:0.5px solid #ddd;padding:1.75rem;display:none}
.score-big{font-size:52px;font-weight:600;color:#534AB7;line-height:1}
.score-pct{font-size:18px;color:#666;margin:4px 0 6px}
.motiv{font-size:15px;font-weight:500;margin-bottom:28px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:24px}
.cat-card{background:#f8f7f3;border-radius:8px;padding:12px 14px}
.cat-name{font-size:12px;color:#666;margin-bottom:4px}
.cat-score{font-size:15px;font-weight:500}
#btn-restart{padding:9px 20px;font-size:14px;border-radius:8px;border:1px solid #534AB7;background:transparent;color:#534AB7;cursor:pointer}
</style>
</head>
<body>
<div class="page-header">
  <div class="page-title">API Design</div>
  <div class="page-sub">40 questions covering all key topics. Shuffled each attempt.</div>
</div>

<div class="card" id="quiz-card">
  <div id="prog-lbl"></div>
  <div id="prog-wrap"><div id="prog-bar" style="width:0%"></div></div>
  <div id="cat-lbl"></div>
  <div id="q-text"></div>
  <div id="opts"></div>
  <div id="expl"></div>
  <div class="btn-row">
    <button id="btn-check" onclick="checkAnswer()">Check answer</button>
    <button id="btn-next" onclick="nextQ()">Next →</button>
  </div>
</div>

<div id="results-card"></div>

<script>
const ALL=[
{cat:"API Types",q:"Which API protocol should you default to in most system design interviews?",opts:["GraphQL","gRPC","REST","WebSockets"],ans:2,expl:"REST is the recommended default. It's well-understood, has great tooling, and works for 90% of use cases. Only deviate when you have a specific reason — like GraphQL for flexible data fetching or gRPC for high-performance internal services."},
{cat:"API Types",q:"Which signal from an interviewer most strongly suggests you should consider GraphQL?",opts:["The system needs microservices","They mention 'avoiding over-fetching and under-fetching'","Performance is critical between services","You need WebSocket support"],ans:1,expl:"When an interviewer specifically mentions over-fetching, under-fetching, or 'flexible data fetching for different clients', they're signaling GraphQL. That's the exact problem GraphQL was designed to solve."},
{cat:"API Types",q:"When is RPC (e.g. gRPC) most appropriate in a system design?",opts:["Public-facing mobile app APIs","When you need simple CRUD operations","Internal service-to-service communication where performance is critical","For real-time browser push notifications"],ans:2,expl:"RPC shines for internal microservice communication — binary serialization and HTTP/2 make it significantly faster than JSON/REST. It's generally not used for public-facing APIs where REST's simplicity and tooling is preferred."},
{cat:"API Types",q:"For real-time features like live notifications and chat, which protocol is appropriate?",opts:["REST with polling","GraphQL mutations","WebSockets or Server-Sent Events","gRPC unary calls"],ans:2,expl:"Real-time features require persistent connections, not traditional request-response APIs. WebSockets provide bidirectional real-time communication, and SSE handles server-to-client streaming."},
{cat:"API Types",q:"What is the key architectural difference between REST and RPC?",opts:["REST uses HTTP/2; RPC uses HTTP/1.1","REST is resource-oriented; RPC is action/procedure-oriented","REST is always slower than RPC","REST requires binary serialization"],ans:1,expl:"REST models everything as resources (nouns) and uses HTTP verbs to act on them. RPC lets you think in terms of actions and procedures — e.g. checkPermission(userId, resource) is more natural than trying to model it as a REST resource."},
{cat:"REST Basics",q:"What is the foundation of good REST API design?",opts:["Choosing the right HTTP status codes","Correctly identifying and modeling your resources","Always using JWT authentication","Implementing pagination on every endpoint"],ans:1,expl:"Resource modeling is the foundation. Resources should map directly to the core entities of your system (e.g. events, venues, tickets, bookings). Get this right and the rest of the design follows naturally."},
{cat:"REST Basics",q:"REST resources should be represented as which of the following in URLs?",opts:["Singular nouns (e.g. /event)","Verb phrases (e.g. /getEvent)","Plural nouns (e.g. /events)","Camelcase actions (e.g. /createBooking)"],ans:2,expl:"REST resources should be plural nouns — /events, /bookings, /tickets. Actions (verbs) belong to HTTP methods, not URL paths. Most interviewers notice this convention even if they don't always call it out."},
{cat:"REST Basics",q:"When should you use a nested resource path (e.g. /events/{id}/tickets) vs a query parameter (e.g. /tickets?event_id=123)?",opts:["Nested paths for optional filters; query params for required identifiers","Nested paths when the relationship is required; query params when filtering is optional","Always use nested paths for better SEO","Always use query parameters for simplicity"],ans:1,expl:"Use nested/path parameters when the parent resource is required for the request to make sense. Use query parameters for optional filters — you might want all tickets, or just VIP tickets for a specific event."},
{cat:"REST Basics",q:"Which of these is a REST anti-pattern?",opts:["GET /events/{id}","POST /events/{id}/bookings","GET /getUserTickets","DELETE /bookings/{id}"],ans:2,expl:"GET /getUserTickets is an anti-pattern because it uses a verb-based action name instead of modeling a resource. RESTful design would use GET /users/{id}/tickets — a noun-based resource path with an HTTP verb."},
{cat:"HTTP Methods",q:"Which HTTP method is idempotent AND creates or fully replaces a resource?",opts:["POST","PATCH","PUT","DELETE"],ans:2,expl:"PUT is idempotent — sending the same data multiple times results in the same final state. It either replaces an existing resource entirely or creates it if it doesn't exist. POST is not idempotent (creates duplicates on retry)."},
{cat:"HTTP Methods",q:"A user wants to update only their email address without changing other profile fields. Which HTTP method is most appropriate?",opts:["PUT","POST","PATCH","DELETE"],ans:2,expl:"PATCH is for partial updates — you send only the fields you want to change, not the entire resource. PUT replaces the entire resource, so using it here would require sending all user fields even if only the email changed."},
{cat:"HTTP Methods",q:"Why does idempotency matter for network retries?",opts:["Idempotent requests are faster","Non-idempotent requests like POST can create duplicates if retried after a network failure","Idempotent requests don't need authentication","Only idempotent methods work with load balancers"],ans:1,expl:"When a network failure occurs, clients retry requests. If POST (non-idempotent) is retried, it can create duplicate resources — like double-booking tickets or double-charging a credit card. GET, PUT, and DELETE are safe to retry."},
{cat:"HTTP Methods",q:"Which HTTP methods are idempotent?",opts:["GET, POST, DELETE","POST, PATCH, PUT","GET, PUT, DELETE","GET, POST, PUT, PATCH, DELETE"],ans:2,expl:"GET, PUT, and DELETE are idempotent. POST and PATCH are not guaranteed to be idempotent. GET retrieves without side effects, PUT replaces to the same state, DELETE leaves a resource deleted regardless of how many times called."},
{cat:"HTTP Methods",q:"A user cancels a booking, then accidentally retries the cancellation. What should a correctly designed DELETE endpoint do?",opts:["Return 500 Server Error","Un-cancel the booking on the second call","Return 404 on the second call but the booking remains cancelled — idempotent","Create a new booking"],ans:2,expl:"DELETE is idempotent — repeated calls leave the server in the same state (the resource stays deleted). The response code may differ (204 first time, 404 on retry) but the final state is the same."},
{cat:"Passing Data",q:"Which mechanism is used to identify a specific resource in a REST URL?",opts:["Query parameters","Request body","Path parameters","HTTP headers"],ans:2,expl:"Path parameters identify which specific resource you're working with — e.g. /events/123 makes it clear you want that specific event. Without the path parameter, the request doesn't make sense."},
{cat:"Passing Data",q:"Which type of input is best suited for optional filters like searching events by city and date?",opts:["Path parameters","Request body fields","Query parameters","HTTP headers"],ans:2,expl:"Query parameters handle optional filters and modifiers — /events?city=NYC&date=2024-01-01. They're additive, optional, and visible in the URL for easy debugging and sharing."},
{cat:"Passing Data",q:"In the URL /events?city=NYC&date=2024-01-01, which character separates the first query parameter from the path?",opts:["&","#","?","/"],ans:2,expl:"The ? separates the path from the query string. Subsequent parameters are separated by &. So /events?city=NYC&date=2024-01-01 has two query params: city=NYC and date=2024-01-01."},
{cat:"Passing Data",q:"Where should complex data like ticket quantities and payment method go when creating a booking?",opts:["In the URL path","In query parameters","In the request body","In HTTP headers"],ans:2,expl:"The request body is for the actual payload — complex, structured data you're creating or updating. Things that are too large or sensitive for a URL, like booking details and payment info, belong in the request body."},
{cat:"Passing Data",q:"In POST /events/123/bookings?notify=true, why is 'notify' a query parameter rather than in the body?",opts:["Query params are faster to process","'notify' is optional behavior modifying how the endpoint acts, not core data being created","Query params are encrypted but body is not","You can only use query params with POST"],ans:1,expl:"The notification preference is optional behavior (a modifier) — it changes how the endpoint acts but isn't part of the booking resource itself. Core booking data (tickets, payment) belongs in the body."},
{cat:"Status Codes",q:"What status code should an API return when a new resource is successfully created?",opts:["200 OK","202 Accepted","201 Created","204 No Content"],ans:2,expl:"201 Created is the correct response for a successful POST that creates a new resource. 200 OK is for general success. Returning 201 signals to the client that something new was created, often with the new resource in the response body."},
{cat:"Status Codes",q:"What is the key conceptual difference between 4xx and 5xx status codes?",opts:["4xx are warnings; 5xx are informational","4xx mean the client made an error; 5xx mean the server encountered an error","4xx are for REST; 5xx are for GraphQL","4xx require retrying; 5xx should not be retried"],ans:1,expl:"4xx errors are client errors — the request was bad (wrong format, unauthorized, not found). 5xx errors are server errors — the server failed to process a valid request. This distinction matters for debugging and retry logic."},
{cat:"Status Codes",q:"A client sends a request to a protected endpoint without any authentication token. What is the correct status code?",opts:["403 Forbidden","404 Not Found","401 Unauthorized","400 Bad Request"],ans:2,expl:"401 Unauthorized means authentication is required but wasn't provided (or was invalid). 403 Forbidden means the client is authenticated but doesn't have permission. Without any token at all, 401 is correct."},
{cat:"Status Codes",q:"A rate limiter blocks a client from making more requests. What status code should be returned?",opts:["400 Bad Request","503 Service Unavailable","429 Too Many Requests","403 Forbidden"],ans:2,expl:"429 Too Many Requests is the standard rate-limiting response. It signals to the client that they've exceeded their quota and should slow down, often accompanied by a Retry-After header."},
{cat:"GraphQL",q:"What core problem did Facebook build GraphQL to solve?",opts:["Slow database query performance","Mobile and web apps needing different data from fixed REST endpoints","Lack of encryption in REST APIs","Difficulty implementing microservices"],ans:1,expl:"Facebook's mobile app needed different data than their web app. REST endpoints returned fixed data structures, forcing either endpoint proliferation or over-fetching. GraphQL lets each client request exactly the shape of data it needs."},
{cat:"GraphQL",q:"What is the N+1 problem in GraphQL?",opts:["A GraphQL schema can't have more than N+1 types","Querying N events triggers N additional queries for each event's related data, totaling N+1 database queries instead of 2","GraphQL only supports one query and one mutation","Pagination in GraphQL always skips 1 record"],ans:1,expl:"The N+1 problem: if you fetch 100 events and each event has a venue, a naive implementation makes 1 query for events + 100 queries for venues = 101 total. The solution is batching/dataloader patterns that group related queries together."},
{cat:"GraphQL",q:"How does GraphQL handle authorization differently from REST?",opts:["GraphQL doesn't support authorization","REST secures endpoints; GraphQL secures individual fields in the schema","GraphQL requires OAuth; REST uses API keys","They handle authorization identically"],ans:1,expl:"With REST you secure entire endpoints. With GraphQL, authorization is at the field level — a user might see an event's name and date but not the private venue details. This is controlled per-field in the schema resolvers."},
{cat:"GraphQL",q:"When is GraphQL the WRONG choice for a system design interview?",opts:["When the frontend team needs to iterate quickly","When mobile and web clients need different data","When there are fixed requirements and the interviewer wants to see query optimization","When multiple teams query overlapping data"],ans:2,expl:"In an interview with fixed requirements, GraphQL's flexibility isn't needed. The interviewer often wants to see how you optimize specific query patterns — and GraphQL can get in the way of that conversation. REST is usually simpler."},
{cat:"gRPC & RPC",q:"What does gRPC use for serialization instead of JSON?",opts:["XML","YAML","Protocol Buffers (binary)","MessagePack"],ans:2,expl:"gRPC uses Protocol Buffers — a compact binary format that's smaller and faster to parse than JSON. Combined with HTTP/2, gRPC can be up to 10x more throughput-efficient than JSON over HTTP."},
{cat:"gRPC & RPC",q:"What is a key benefit of generating client/server code from a .proto file?",opts:["It automatically deploys your services","It provides compile-time type safety across multiple programming languages","It makes APIs public automatically","It removes the need for authentication"],ans:1,expl:"From a single .proto definition, gRPC generates client and server code in many languages. This means a Go service and a Java service can communicate with compile-time type checking — catching mismatches before deployment rather than at runtime."},
{cat:"gRPC & RPC",q:"In a typical system design, which APIs would you use gRPC for vs REST?",opts:["gRPC for everything to maximize performance","REST for public-facing APIs; gRPC for internal service-to-service communication","REST for everything since gRPC is too complex","gRPC for public APIs; REST for internal services"],ans:1,expl:"A common pattern: REST for public APIs consumed by mobile apps and web clients (better tooling, easier to use), gRPC for internal microservice communication where performance and type safety matter most."},
{cat:"Pagination",q:"What is the main weakness of offset-based pagination?",opts:["It can't support sorting","It only works with SQL databases","New records added mid-session can cause duplicates or skipped items as data shifts","It's slower than cursor-based pagination for all queries"],ans:2,expl:"Offset-based pagination counts from the beginning each time. If new records are inserted while a user paginates, the offset shifts — they might see duplicates or miss records. It's also slow on large datasets."},
{cat:"Pagination",q:"In cursor-based pagination, what does the cursor typically represent?",opts:["The page number","A pointer to a specific record (like an encoded ID or timestamp)","The total number of records","The client's session ID"],ans:1,expl:"A cursor is a stable pointer to a specific position in the dataset — typically an encoded ID or timestamp of the last seen record. New records being added don't shift the cursor's position, making it reliable for dynamic data."},
{cat:"Pagination",q:"For a simple CRUD app in an interview, which pagination approach is usually sufficient?",opts:["Cursor-based, always","Offset-based is fine unless dealing with real-time data or high-volume scenarios","You must implement both and let clients choose","No pagination is needed for interviews"],ans:1,expl:"Offset-based pagination is simpler to explain and implement. For most interview scenarios it's perfectly acceptable. The interviewer cares more about whether you remembered to paginate than which method you chose."},
{cat:"Pagination",q:"What does a cursor-based pagination response typically include alongside the results?",opts:["The total count of all records","A next_cursor value pointing to the last record for the next request","The SQL query used","The server region that handled the request"],ans:1,expl:"A cursor-based response includes the data items plus a next_cursor value. The client passes this cursor in the next request to fetch the following page — the server uses it to find where the previous page ended."},
{cat:"Versioning",q:"Which API versioning strategy is recommended for most system design interviews?",opts:["Header versioning (Accept-Version: v2)","No versioning is needed","URL versioning (e.g. /v1/events)","Query parameter versioning (/events?version=2)"],ans:2,expl:"URL versioning (/v1/events, /v2/events) is the most widely understood approach. It's explicit, easy to test in a browser, and simple to route to different code paths. Header versioning is cleaner but less obvious to developers."},
{cat:"Versioning",q:"Why is API versioning important in production systems?",opts:["It improves query performance","It allows APIs to evolve without breaking existing clients","It is required by the HTTP specification","It's only needed for GraphQL APIs"],ans:1,expl:"APIs evolve over time. Versioning lets you introduce breaking changes without immediately forcing all clients to update. Public APIs especially need versioning since you can't control when external clients update their code."},
{cat:"Security",q:"What is the difference between authentication and authorization?",opts:["They are the same thing","Authentication verifies identity; authorization checks if that identity has permission to perform the action","Authentication checks permissions; authorization verifies identity","Authentication is for users; authorization is for services"],ans:1,expl:"Authentication answers 'who are you?' (verifying identity). Authorization answers 'are you allowed to do this?' (checking permissions). You must authenticate before you can authorize."},
{cat:"Security",q:"When is an API key the appropriate authentication method?",opts:["User-facing mobile apps and web products","Server-to-server communication and 3rd-party developer access","Whenever JWT tokens are too complex","Any time you need to track user sessions"],ans:1,expl:"API keys work well for server-to-server calls and developer/programmatic access. They're NOT appropriate for user-facing products — users shouldn't manage cryptographic strings, and API keys don't carry user session context."},
{cat:"Security",q:"What is a key advantage of JWT tokens for distributed systems?",opts:["They never expire","They are stored server-side for easy revocation","Any service with the verification key can validate tokens independently without a database lookup","They are faster than API keys"],ans:2,expl:"JWTs are self-contained — the token encodes user info and is signed. Any service with the secret key can verify and decode it without querying a database. This is invaluable in distributed microservice architectures."},
{cat:"Security",q:"What does RBAC stand for and what does it control?",opts:["Resource-Based Access Control — which resources exist in the system","Role-Based Access Control — different types of users get different permissions","Request Body Access Control — what fields are visible in API responses","Response Body Access Control — which clients receive which data"],ans:1,expl:"RBAC (Role-Based Access Control) assigns roles to users (e.g. customer, venue_manager, admin) and permissions to those roles. It's a clean way to manage what different types of users can and can't do in your system."},
{cat:"Security",q:"A client includes a user_id in the request body of an HTTPS-protected endpoint. What security concern does this raise?",opts:["HTTPS doesn't encrypt request bodies","The user_id value could be tampered with by an attacker to access another user's data","This is perfectly secure since HTTPS is end-to-end encrypted","Request bodies are limited to 1KB"],ans:1,expl:"HTTPS encrypts data in transit but doesn't guarantee the contents were generated by a legitimate client. An attacker can construct any request body. Servers must validate that the user_id in the body matches the authenticated user from their token."},
{cat:"Interview Strategy",q:"How much time should you ideally spend on API design in a system design interview?",opts:["20-30 minutes to get it perfect","As long as it takes","Around 5 minutes — then move on to more complex architectural challenges","API design should be skipped entirely"],ans:2,expl:"API design typically deserves about 5 minutes. Most interviewers want to see you can design a reasonable API, not a perfect one. Candidates more often hurt themselves by over-investing in API design than by under-investing."},
{cat:"Interview Strategy",q:"In an interview, a user wants to 'startGame'. How should you model this in a REST API?",opts:["POST /startGame","GET /game/start","PATCH /games with { status: 'started' }","PUT /gameActions/start"],ans:2,expl:"REST thinks in resources, not actions. 'Start a game' is really 'update a game's status to started' — a partial update using PATCH on the games resource. The key insight is modeling the state change rather than the action."},
{cat:"Interview Strategy",q:"You're designing an internal booking service that communicates with an inventory service hundreds of times per second. What protocol should you consider?",opts:["REST over HTTP/1.1 since it's the default","WebSockets for bidirectional communication","gRPC for high-performance binary internal communication","GraphQL since it reduces over-fetching"],ans:2,expl:"For high-frequency internal service communication, gRPC is the right tool — binary Protocol Buffers, HTTP/2 multiplexing, and generated type-safe clients make it significantly more efficient than JSON/REST at scale."},
];

let questions=[],qi=0,selected=null,checked=false,catScores={};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function init(){
  questions=shuffle([...ALL]);qi=0;selected=null;checked=false;catScores={};
  questions.forEach(q=>{if(!catScores[q.cat])catScores[q.cat]={c:0,t:0};catScores[q.cat].t++;});
  document.getElementById('results-card').style.display='none';
  document.getElementById('quiz-card').style.display='block';
  render();
}
function render(){
  const q=questions[qi];
  document.getElementById('prog-bar').style.width=Math.round((qi/questions.length)*100)+'%';
  document.getElementById('prog-lbl').textContent='Question '+(qi+1)+' of '+questions.length;
  document.getElementById('cat-lbl').textContent=q.cat;
  document.getElementById('q-text').textContent=q.q;
  const letters=['A','B','C','D'];
  const opts=document.getElementById('opts');opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const d=document.createElement('div');d.className='opt';
    d.innerHTML='<span class="letter">'+letters[i]+'</span><span class="opt-text">'+o+'</span>';
    d.onclick=()=>selectOpt(i);opts.appendChild(d);
  });
  const expl=document.getElementById('expl');expl.style.display='none';expl.className='';
  document.getElementById('btn-next').style.display='none';
  const bc=document.getElementById('btn-check');bc.removeAttribute('class');bc.style.opacity='.45';bc.style.pointerEvents='none';
  selected=null;checked=false;
}
function selectOpt(i){
  if(checked)return;selected=i;
  const divs=document.getElementById('opts').children;
  for(let d of divs)d.className='opt';divs[i].className='opt sel';
  const bc=document.getElementById('btn-check');bc.classList.add('active');bc.style.opacity='1';bc.style.pointerEvents='auto';
}
function checkAnswer(){
  if(selected===null||checked)return;checked=true;
  const q=questions[qi];
  const divs=document.getElementById('opts').children;
  for(let i=0;i<divs.length;i++){
    if(i===q.ans)divs[i].className='opt correct';
    else if(i===selected)divs[i].className='opt wrong';
    else divs[i].className='opt dim';
  }
  const ok=selected===q.ans;if(ok)catScores[q.cat].c++;
  const expl=document.getElementById('expl');
  expl.textContent=(ok?'✓ Correct! ':'✗ Incorrect. ')+q.expl;
  expl.className=ok?'correct':'wrong';expl.style.display='block';
  document.getElementById('btn-next').style.display='inline-block';
  const bc=document.getElementById('btn-check');bc.style.opacity='.45';bc.style.pointerEvents='none';
}
function nextQ(){qi++;if(qi>=questions.length){showResults();return;}render();}
function showResults(){
  document.getElementById('quiz-card').style.display='none';
  const total=questions.length;
  const correct=Object.values(catScores).reduce((s,v)=>s+v.c,0);
  const pct=Math.round((correct/total)*100);
  let motiv='Keep studying — you\'ll get there!';
  if(pct>=90)motiv='Outstanding! You\'ve mastered API design.';
  else if(pct>=75)motiv='Great work! Strong grasp of the fundamentals.';
  else if(pct>=60)motiv='Good effort! Review a few weak areas and retake.';
  const catHTML=Object.entries(catScores).map(([n,s])=>'<div class="cat-card"><div class="cat-name">'+n+'</div><div class="cat-score">'+s.c+'/'+s.t+' correct</div></div>').join('');
  const r=document.getElementById('results-card');
  r.innerHTML='<div class="score-big">'+correct+'/'+total+'</div><div class="score-pct">'+pct+'% correct</div><div class="motiv">'+motiv+'</div><div class="cat-grid">'+catHTML+'</div><button id="btn-restart" onclick="init()">↺ Restart quiz</button>';
  r.style.display='block';
}
init();
</script>
</body>
</html>
