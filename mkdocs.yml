site_name: System Design Interview Prep
site_description: Structured revision material for system design interviews - Quick reference summaries + deep dives
site_author: Interview Prep Team
docs_dir: docs
repo_url: https://github.com/nitinkc/SystemDesign-Revision

theme:
  name: material
  custom_dir: overrides
  color_mode: auto
  user_color_mode_toggle: true
  primary: teal
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  highlightjs: true
  hljs_languages:
    - yaml
    - java
    - python
    - javascript
    - go
    - sql
    - bash
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.expand
    #    - toc.integrate
    - content.code.copy
    - search
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - toc:
      toc_depth: 2-3
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  - https://unpkg.com/mermaid@10/dist/mermaid.js
  - js/mermaid-init.js
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - js/interactive-core.js
  - js/storage.js
  - js/quiz-engine.js
  - js/quiz-template-loader.js
  - js/flashcard-engine.js
  - js/flashcards-template-loader.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.css
  - css/custom.css

nav:
  - Home: index.md
  - Quiz :
      - quiz/index.md
      - In a Hurry - Core Concepts: quiz/core_concepts_quiz.md
      - In a Hurry - Key Technologies: quiz/key_technologies_quiz.md
      - Core concepts - Networking Essentials: quiz/networking-essentials-quiz.md
      - Core concepts - API Design: quiz/api-design-quiz.md
      - Core concepts - Data Modeling: quiz/data-modeling-quiz-dark.md
      - Core concepts - DB Indexing: quiz/db-indexing-quiz.md
      - Technologies - Time Series DB: quiz/time-series-databases-quiz.md
  - Flashcards:
      - flashcards/index.md
      - Data Modelling: flashcards/data-modeling-flashcards.md

